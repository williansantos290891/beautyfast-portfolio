name: Refresh portfolio evidence
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: portfolio-evidence
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python -m pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/generate_synthetic_leads.py --count 300 --seed 42
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: npm install
      - run: npm test
      - run: npm run build
      - run: python scripts/capture_portfolio.py
      - run: python scripts/publish_generated_evidence.py
        env:
          GH_TOKEN: ${{ github.token }}
